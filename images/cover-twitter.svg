<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="twBg" cx="60%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#040A14"/>
    </radialGradient>
    <radialGradient id="twCoinFill" cx="32%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#081628"/>
    </radialGradient>
    <linearGradient id="twGoldBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8A6620"/>
      <stop offset="100%" stop-color="#D7B46A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#twBg)"/>

  <!-- Subtle grid -->
  <g stroke="#1FE6D1" stroke-width="1" opacity="0.04">
    <line x1="0" y1="166" x2="1500" y2="166"/>
    <line x1="0" y1="333" x2="1500" y2="333"/>
  </g>

  <!-- Profile pic sits bottom-left (~60,290 to 220,440). Brand content lives centered-right. -->

  <!-- Logo coin (centered, top half — well clear of profile pic area) -->
  <g transform="translate(485, 95)">
    <circle cx="105" cy="105" r="105" fill="url(#twCoinFill)" stroke="#0F766E" stroke-width="8"/>
    <circle cx="105" cy="105" r="93" fill="none" stroke="#1FE6D1" stroke-width="1.2" opacity="0.35"/>
    <text x="105" y="95" font-family="Manrope, sans-serif" font-size="42" font-weight="900"
          text-anchor="middle" fill="#F7F8F5" letter-spacing="2.5">AFWM</text>
    <g transform="translate(50, 122)">
      <rect x="0"  y="34" width="18" height="30" fill="url(#twGoldBar)" opacity="0.75" rx="1.2"/>
      <rect x="24" y="24" width="18" height="40" fill="url(#twGoldBar)" opacity="0.85" rx="1.2"/>
      <rect x="48" y="12" width="18" height="52" fill="url(#twGoldBar)" rx="1.2"/>
      <rect x="72" y="0"  width="18" height="64" fill="url(#twGoldBar)" rx="1.2"/>
    </g>
    <g stroke="#1FE6D1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 44 188 L 158 122"/>
      <path d="M 146 116 L 161 121 L 154 138"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="750" y="370" font-family="Manrope, sans-serif" font-size="46" font-weight="900"
        text-anchor="middle" fill="#F7F8F5" letter-spacing="0.05em">AF WEALTH MINDSET</text>

  <!-- Tagline -->
  <text x="750" y="412" font-family="Manrope, sans-serif" font-size="18" font-weight="700"
        text-anchor="middle" fill="#1FE6D1" letter-spacing="0.4em">MONEY · DISCIPLINE · TRUTH</text>

  <!-- Decorative gold rule -->
  <line x1="680" y1="438" x2="820" y2="438" stroke="#B88935" stroke-width="2" opacity="0.7"/>
</svg>
