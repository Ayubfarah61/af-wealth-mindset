<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <radialGradient id="fbBg" cx="35%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#040A14"/>
    </radialGradient>
    <radialGradient id="fbCoinFill" cx="32%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#081628"/>
    </radialGradient>
    <linearGradient id="fbGoldBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8A6620"/>
      <stop offset="100%" stop-color="#D7B46A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="url(#fbBg)"/>

  <!-- Subtle grid -->
  <g stroke="#1FE6D1" stroke-width="1" opacity="0.04">
    <line x1="0" y1="208" x2="1640" y2="208"/>
    <line x1="0" y1="416" x2="1640" y2="416"/>
  </g>

  <!-- Logo coin (left, generously spaced) -->
  <g transform="translate(180, 172)">
    <circle cx="140" cy="140" r="140" fill="url(#fbCoinFill)" stroke="#0F766E" stroke-width="10"/>
    <circle cx="140" cy="140" r="125" fill="none" stroke="#1FE6D1" stroke-width="1.4" opacity="0.35"/>
    <text x="140" y="126" font-family="Manrope, sans-serif" font-size="56" font-weight="900"
          text-anchor="middle" fill="#F7F8F5" letter-spacing="3.5">AFWM</text>
    <g transform="translate(66, 162)">
      <rect x="0"  y="46" width="24" height="40" fill="url(#fbGoldBar)" opacity="0.75" rx="1.5"/>
      <rect x="32" y="32" width="24" height="54" fill="url(#fbGoldBar)" opacity="0.85" rx="1.5"/>
      <rect x="64" y="16" width="24" height="70" fill="url(#fbGoldBar)" rx="1.5"/>
      <rect x="96" y="0"  width="24" height="86" fill="url(#fbGoldBar)" rx="1.5"/>
    </g>
    <g stroke="#1FE6D1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 58 254 L 208 162"/>
      <path d="M 192 154 L 213 160 L 204 182"/>
    </g>
  </g>

  <!-- Brand name + tagline -->
  <g transform="translate(530, 252)">
    <text x="0" y="0" font-family="Manrope, sans-serif" font-size="68" font-weight="900" fill="#F7F8F5" letter-spacing="0.04em">AF WEALTH MINDSET</text>
    <text x="0" y="55" font-family="Manrope, sans-serif" font-size="24" font-weight="700" fill="#1FE6D1" letter-spacing="0.35em">MONEY · DISCIPLINE · TRUTH</text>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#B88935" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
