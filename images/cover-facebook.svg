<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <radialGradient id="fbBg" cx="25%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#040A14"/>
    </radialGradient>
    <radialGradient id="fbCoinFill" cx="32%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#081628"/>
    </radialGradient>
    <linearGradient id="fbGoldBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8A6620"/>
      <stop offset="100%" stop-color="#D7B46A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="url(#fbBg)"/>

  <!-- Subtle teal grid -->
  <g stroke="#1FE6D1" stroke-width="1" opacity="0.04">
    <line x1="0" y1="208" x2="1640" y2="208"/>
    <line x1="0" y1="416" x2="1640" y2="416"/>
    <line x1="410"  y1="0" x2="410"  y2="624"/>
    <line x1="820"  y1="0" x2="820"  y2="624"/>
    <line x1="1230" y1="0" x2="1230" y2="624"/>
  </g>

  <!-- Teal corner brackets -->
  <g stroke="#1FE6D1" stroke-width="3" fill="none" opacity="0.5">
    <path d="M 50 50 L 50 120 M 50 50 L 120 50"/>
    <path d="M 1590 50 L 1590 120 M 1590 50 L 1520 50"/>
    <path d="M 50 574 L 50 504 M 50 574 L 120 574"/>
    <path d="M 1590 574 L 1590 504 M 1590 574 L 1520 574"/>
  </g>

  <!-- Logo coin (left) -->
  <g transform="translate(120, 192)">
    <circle cx="120" cy="120" r="120" fill="url(#fbCoinFill)" stroke="#0F766E" stroke-width="9"/>
    <circle cx="120" cy="120" r="107" fill="none" stroke="#1FE6D1" stroke-width="1.2" opacity="0.35"/>
    <text x="120" y="108" font-family="Manrope, sans-serif" font-size="48" font-weight="900"
          text-anchor="middle" fill="#F7F8F5" letter-spacing="3">AFWM</text>
    <g transform="translate(56, 138)">
      <rect x="0"  y="40" width="22" height="36" fill="url(#fbGoldBar)" opacity="0.75" rx="1.5"/>
      <rect x="30" y="28" width="22" height="48" fill="url(#fbGoldBar)" opacity="0.85" rx="1.5"/>
      <rect x="60" y="14" width="22" height="62" fill="url(#fbGoldBar)" rx="1.5"/>
      <rect x="90" y="0"  width="22" height="76" fill="url(#fbGoldBar)" rx="1.5"/>
    </g>
    <g stroke="#1FE6D1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 52 218 L 184 138"/>
      <path d="M 169 130 L 188 136 L 180 156"/>
    </g>
  </g>

  <!-- Headline + tagline -->
  <g transform="translate(420, 215)">
    <text x="0" y="40" font-family="Manrope, sans-serif" font-size="34" font-weight="900" fill="#F7F8F5" letter-spacing="0.04em">AF WEALTH MINDSET</text>
    <text x="0" y="80" font-family="Manrope, sans-serif" font-size="18" font-weight="700" fill="#1FE6D1" letter-spacing="0.32em">MONEY · DISCIPLINE · TRUTH</text>

    <!-- The hook -->
    <text x="0" y="170" font-family="Cormorant Garamond, serif" font-style="italic" font-weight="700" font-size="52" fill="#F7F8F5">What your bank
      <tspan fill="#1FE6D1">hopes</tspan> you never ask.
    </text>
    <text x="0" y="220" font-family="Manrope, sans-serif" font-size="20" font-weight="500" fill="#F7F8F5" opacity="0.78">Real spreadsheets. Forbidden insight. Zero subscriptions.</text>
  </g>

  <!-- URL bottom-right -->
  <text x="1540" y="565" font-family="Manrope, sans-serif" font-size="20" font-weight="700"
        text-anchor="end" fill="#1FE6D1" letter-spacing="0.18em">AFWEALTHMINDSET.COM</text>
</svg>
