<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <radialGradient id="fbBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#040A14"/>
    </radialGradient>
    <radialGradient id="fbCoinFill" cx="32%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="55%" stop-color="#10243E"/>
      <stop offset="100%" stop-color="#081628"/>
    </radialGradient>
    <linearGradient id="fbGoldBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8A6620"/>
      <stop offset="100%" stop-color="#D7B46A"/>
    </linearGradient>
  </defs>

  <rect width="1640" height="624" fill="url(#fbBg)"/>

  <g stroke="#1FE6D1" stroke-width="1" opacity="0.04">
    <line x1="0" y1="208" x2="1640" y2="208"/>
    <line x1="0" y1="416" x2="1640" y2="416"/>
  </g>

  <!-- EVERYTHING CENTERED -->
  <!-- Logo coin on top -->
  <g transform="translate(720, 110)">
    <circle cx="100" cy="100" r="100" fill="url(#fbCoinFill)" stroke="#0F766E" stroke-width="7"/>
    <circle cx="100" cy="100" r="89" fill="none" stroke="#1FE6D1" stroke-width="1.2" opacity="0.35"/>
    <text x="100" y="90" font-family="Manrope, sans-serif" font-size="40" font-weight="900"
          text-anchor="middle" fill="#F7F8F5" letter-spacing="2.5">AFWM</text>
    <g transform="translate(47, 115)">
      <rect x="0"  y="33" width="17" height="29" fill="url(#fbGoldBar)" opacity="0.75" rx="1.2"/>
      <rect x="24" y="22" width="17" height="40" fill="url(#fbGoldBar)" opacity="0.85" rx="1.2"/>
      <rect x="48" y="11" width="17" height="51" fill="url(#fbGoldBar)" rx="1.2"/>
      <rect x="72" y="0"  width="17" height="62" fill="url(#fbGoldBar)" rx="1.2"/>
    </g>
    <g stroke="#1FE6D1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 42 180 L 154 115"/>
      <path d="M 141 108 L 158 113 L 152 130"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="820" y="380" font-family="Manrope, sans-serif" font-size="56" font-weight="900"
        text-anchor="middle" fill="#F7F8F5" letter-spacing="0.05em">AF WEALTH MINDSET</text>

  <!-- Tagline -->
  <text x="820" y="425" font-family="Manrope, sans-serif" font-size="20" font-weight="700"
        text-anchor="middle" fill="#1FE6D1" letter-spacing="0.4em">MONEY · DISCIPLINE · TRUTH</text>

  <!-- Gold accent -->
  <line x1="740" y1="455" x2="900" y2="455" stroke="#B88935" stroke-width="2.5" opacity="0.7"/>
</svg>
