name = "afwm-marketing"
main = "worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 binding (create with: wrangler d1 create afwm-marketing)
[[d1_databases]]
binding = "DB"
database_name = "afwm-marketing"
database_id = "782249bc-f0ea-4842-a752-343b55e794e6"

# Cron triggers
[triggers]
crons = [
  "*/30 * * * *",  # every 30 min — executor
  "0 6 * * *"      # daily 06:00 UTC — Trend Scout + Director
]

# Non-secret defaults. Override via `wrangler secret put` for the real ones.
[vars]
ENABLED_PLATFORMS = "youtube,pinterest"
CLAUDE_MODEL = "claude-haiku-4-5-20251001"
TIKTOK_DRAFT_ONLY = "1"   # flip to 0 once your TikTok Content Posting app is approved
DAILY_USD_CAP = "0.08"     # hard daily ceiling on Claude API cost. ~$2.40/month max. Bump to 0.20 ($6/month) once sales come in.
